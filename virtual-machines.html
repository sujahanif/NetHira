<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netbox Lite - Virtual Machines</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-[#0f172a] h-screen flex overflow-hidden relative transition-colors duration-300">

    <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity"></div>

    <aside id="sidebar" class="w-64 bg-[#131b2f] dark:bg-[#0b1121] text-white flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 z-30">
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-700/50">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-1.5 rounded-md"><i class="fa-solid fa-server text-sm"></i></div>
                <span class="font-bold text-lg tracking-wider italic text-blue-100">NETBOX LITE</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 flex flex-col">
            <a href="dashboard.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Dashboard</a>
            <a href="index.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Devices</a>
            <a href="virtual-machines.html" class="block px-4 py-3 text-sm text-white bg-blue-600 rounded-lg font-medium shadow-md">Virtual Machines</a>
            <a href="ip-addresses.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">IP Addresses</a>
            <div class="mt-auto pt-8">
                <a href="settings.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition flex items-center gap-2"><i class="fa-solid fa-gear"></i> Settings</a>
            </div>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden w-full">
        <header class="h-16 bg-white dark:bg-[#1e293b] border-b dark:border-gray-700/50 flex items-center justify-between px-4 md:px-8 z-10 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 md:hidden text-2xl transition"><i class="fa-solid fa-bars"></i></button>
                <div class="text-sm font-bold text-gray-400 tracking-widest hidden md:block">VIRTUAL MACHINES</div>
            </div>
            <div class="flex items-center gap-4 md:gap-6">
                <button onclick="toggleTheme()" class="text-gray-400 hover:text-yellow-500 dark:hover:text-blue-400 transition text-lg" title="Toggle Theme">
                    <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i>
                </button>
                <div class="hidden sm:flex items-center gap-2 bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full border dark:border-gray-700">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div><span class="text-xs font-semibold text-gray-600 dark:text-gray-300">SYSTEM ACTIVE</span>
                </div>
                <div class="flex items-center gap-3 sm:border-l dark:border-gray-700 sm:pl-6">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-bold text-gray-800 dark:text-gray-200" id="headerName">Administrator</div>
                        <div class="text-[10px] font-bold text-green-500">ADMINISTRATOR</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm" id="headerInitial">A</div>
                    <button onclick="logout()" class="text-gray-400 hover:text-red-500 ml-1 md:ml-2 transition" title="Keluar"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#f8f9fc] dark:bg-[#0f172a] transition-colors duration-300">
            <div class="flex flex-col 2xl:flex-row 2xl:items-center justify-between gap-4 mb-6">
                <h1 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-white italic flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-cloud text-lg text-blue-500"></i> VM Inventory
                </h1>
                
                <div class="flex flex-col lg:flex-row items-start lg:items-center gap-4 w-full 2xl:w-auto justify-end">
                    <div class="flex items-center gap-2 w-full lg:w-auto">
                        <select id="filterStatus" class="border dark:border-gray-600 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm text-gray-600 dark:text-gray-200 bg-white dark:bg-gray-700 outline-none focus:border-blue-500"><option value="All">All Status</option><option value="ONLINE">ONLINE</option><option value="OFFLINE">OFFLINE</option></select>
                        <select id="filterOS" class="border dark:border-gray-600 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm text-gray-600 dark:text-gray-200 bg-white dark:bg-gray-700 outline-none focus:border-blue-500"><option value="All">All OS</option><option value="Ubuntu">Ubuntu</option><option value="Windows">Windows</option><option value="CentOS">CentOS</option></select>
                        <input type="text" id="searchInput" placeholder="Search VM or IP..." class="border dark:border-gray-600 rounded-lg px-3 py-2 text-xs md:text-sm text-gray-800 dark:text-gray-200 bg-white dark:bg-gray-700 outline-none focus:border-blue-500 w-full lg:w-40 flex-grow">
                    </div>
                    <div class="flex items-center gap-2 w-full lg:w-auto overflow-x-auto pb-1 lg:pb-0">
                        <button onclick="exportData()" class="whitespace-nowrap flex-1 sm:flex-none bg-[#f43f5e] hover:bg-rose-600 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                        <button onclick="backupData()" class="whitespace-nowrap flex-1 sm:flex-none bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition"><i class="fa-solid fa-download"></i> BACKUP</button>
                        <input type="file" id="restoreFile" accept=".json" class="hidden" onchange="processRestore(event)">
                        <button onclick="document.getElementById('restoreFile').click()" class="whitespace-nowrap flex-1 sm:flex-none bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition"><i class="fa-solid fa-upload"></i> RESTORE</button>
                        <button onclick="openModal()" class="whitespace-nowrap flex-1 sm:flex-none bg-[#2a56f6] hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition"><i class="fa-solid fa-plus"></i> ADD VM</button>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-[#1e293b] rounded-xl border dark:border-gray-700/50 shadow-sm overflow-x-auto w-full transition-colors duration-300">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-50/50 dark:bg-gray-800/50 border-b dark:border-gray-700">
                            <th onclick="sortTable('name')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">VM Name <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i></th>
                            <th onclick="sortTable('os')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">OS <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i></th>
                            <th onclick="sortTable('host')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">Host Node <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i></th>
                            <th onclick="sortTable('ip')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">IP Address <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i></th>
                            <th onclick="sortTable('status')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/12">Status <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i></th>
                            <th class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y dark:divide-gray-700"></tbody>
                </table>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center mt-6 gap-4">
                <div class="text-sm text-gray-500 dark:text-gray-400" id="paginationInfo">Menampilkan 0 sampai 0 dari 0 VM</div>
                <div class="flex items-center gap-1" id="paginationButtons"></div>
            </div>
        </main>
    </div>

    <div id="addDeviceModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center transition-opacity p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="px-6 py-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900"><h3 class="font-bold text-gray-800 dark:text-white"><i class="fa-solid fa-cloud mr-2 text-blue-500"></i> Add New VM</h3><button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <div class="p-4 md:p-6 space-y-4">
                <div><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">VM Name</label><input type="text" id="modalName" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Operating System</label><select id="modalOS" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"><option value="Ubuntu">Ubuntu</option><option value="Windows">Windows</option><option value="CentOS">CentOS</option></select></div>
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Status</label><select id="modalStatus" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"><option value="ONLINE">ONLINE</option><option value="OFFLINE">OFFLINE</option></select></div>
                </div>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Host Node</label><input type="text" id="modalHost" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">IP Address</label><input type="text" id="modalIpAddress" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                </div>
            </div>
            <div class="px-6 py-4 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-900 flex justify-end gap-3"><button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">Cancel</button><button onclick="saveDevice()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition">Save VM</button></div>
        </div>
    </div>

    <div id="editDeviceModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center transition-opacity p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="px-6 py-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900"><h3 class="font-bold text-gray-800 dark:text-white"><i class="fa-solid fa-pen-to-square mr-2 text-blue-500"></i> Edit VM</h3><button onclick="closeEditModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <div class="p-4 md:p-6 space-y-4">
                <input type="hidden" id="editModalId">
                <div><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">VM Name</label><input type="text" id="editModalName" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Operating System</label><select id="editModalOS" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"><option value="Ubuntu">Ubuntu</option><option value="Windows">Windows</option><option value="CentOS">CentOS</option></select></div>
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Status</label><select id="editModalStatus" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"><option value="ONLINE">ONLINE</option><option value="OFFLINE">OFFLINE</option></select></div>
                </div>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Host Node</label><input type="text" id="editModalHost" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">IP Address</label><input type="text" id="editModalIpAddress" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                </div>
            </div>
            <div class="px-6 py-4 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-900 flex justify-end gap-3"><button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">Cancel</button><button onclick="updateDevice()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition">Update VM</button></div>
        </div>
    </div>

    <script src="vm.js"></script>
</body>
</html>
