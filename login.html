<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Netbox Lite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-[#131b2f] h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        
        <div class="bg-[#2a56f6] p-8 text-center">
            <div class="inline-block bg-white/20 p-4 rounded-full mb-4 shadow-inner">
                <i class="fa-solid fa-server text-4xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-widest italic">NETBOX LITE</h1>
            <p class="text-blue-100 text-sm mt-2">Masuk untuk mengelola aset hardware</p>
        </div>
        
        <div class="p-8">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" placeholder="Ketik: admin" class="w-full border border-gray-300 rounded-lg pl-11 pr-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" placeholder="Ketik: admin" class="w-full border border-gray-300 rounded-lg pl-11 pr-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required>
                    </div>
                </div>
                
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-600 cursor-pointer hover:text-gray-800">
                        <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> Ingat saya
                    </label>
                    <a href="#" class="text-[#2a56f6] hover:underline font-semibold">Lupa Password?</a>
                </div>
                
                <button type="submit" class="w-full bg-[#2a56f6] hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex justify-center items-center gap-2">
                    SIGN IN <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
