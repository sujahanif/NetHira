<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Netbox Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <aside class="w-64 bg-[#131b2f] text-white flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-gray-700/50">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-1.5 rounded-md">
                    <i class="fa-solid fa-server text-sm"></i>
                </div>
                <span class="font-bold text-lg tracking-wider italic text-blue-100">NETBOX LITE</span>
            </div>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="dashboard.html" class="block px-4 py-3 text-sm text-white bg-blue-600 rounded-lg font-medium shadow-md">Dashboard</a>
            <a href="index.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Devices</a>
            <a href="#" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Virtual Machines</a>
            <a href="#" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">IP Addresses</a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b flex items-center justify-between px-8 z-10">
            <div class="text-sm font-bold text-gray-400 tracking-widest">DASHBOARD</div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 bg-gray-100 px-3 py-1 rounded-full border">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div>
                    <span class="text-xs font-semibold text-gray-600">SYSTEM ACTIVE</span>
                </div>
                <div class="flex items-center gap-3 border-l pl-6">
                    <div class="text-right">
                        <div class="text-sm font-bold text-gray-800">Syahira Adenia</div>
                        <div class="text-[10px] font-bold text-green-500">ADMINISTRATOR</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">S</div>
                    <button onclick="logout()" class="text-gray-400 hover:text-gray-600 ml-2" title="Keluar">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-[#f8f9fc]">
            <h1 class="text-2xl font-bold text-gray-800 italic mb-6">System Overview</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border shadow-sm flex items-center gap-4">
                    <div class="bg-blue-100 text-blue-600 p-4 rounded-lg">
                        <i class="fa-solid fa-server text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 font-bold">Total Devices</p>
                        <h2 id="statTotal" class="text-3xl font-bold text-gray-800">0</h2>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl border shadow-sm flex items-center gap-4">
                    <div class="bg-green-100 text-green-600 p-4 rounded-lg">
                        <i class="fa-solid fa-wifi text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 font-bold">Online</p>
                        <h2 id="statOnline" class="text-3xl font-bold text-gray-800">0</h2>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl border shadow-sm flex items-center gap-4">
                    <div class="bg-red-100 text-red-600 p-4 rounded-lg">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 font-bold">Offline</p>
                        <h2 id="statOffline" class="text-3xl font-bold text-gray-800">0</h2>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl border shadow-sm w-full max-w-2xl">
                <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Distribusi Role Hardware</h3>
                <canvas id="roleChart" width="400" height="200"></canvas>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <div class="bg-white p-6 rounded-xl border shadow-sm w-full">
                    <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Distribusi Role Hardware</h3>
                    <canvas id="roleChart" width="400" height="200"></canvas>
                </div>

                <div class="bg-white p-6 rounded-xl border shadow-sm w-full overflow-x-auto">
                    <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Recently Added Devices</h3>
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-gray-50/50 border-b">
                                <th class="py-3 px-4 text-xs font-bold text-gray-400 uppercase">Device & Role</th>
                                <th class="py-3 px-4 text-xs font-bold text-gray-400 uppercase">IP Address</th>
                                <th class="py-3 px-4 text-xs font-bold text-gray-400 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentTableBody" class="divide-y">
                            </tbody>
                    </table>
                </div>

            </div>

        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
