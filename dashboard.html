<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Netbox Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    
    <script src="theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-[#0f172a] h-screen flex overflow-hidden relative transition-colors duration-300">

    <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity"></div>

    <aside id="sidebar" class="w-64 bg-[#131b2f] dark:bg-[#0b1121] text-white flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 z-30">
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-700/50">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-1.5 rounded-md"><i class="fa-solid fa-server text-sm"></i></div>
                <span class="font-bold text-lg tracking-wider italic text-blue-100">NETBOX LITE</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 flex flex-col">
            <a href="dashboard.html" class="block px-4 py-3 text-sm text-white bg-blue-600 rounded-lg font-medium shadow-md">Dashboard</a>
            <a href="index.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Devices</a>
            <a href="virtual-machines.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Virtual Machines</a>
            <a href="ip-addresses.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">IP Addresses</a>
            
            <div class="mt-auto pt-8">
                <a href="settings.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-gear"></i> Settings
                </a>
            </div>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden w-full">
        <header class="h-16 bg-white dark:bg-[#1e293b] border-b dark:border-gray-700/50 flex items-center justify-between px-4 md:px-8 z-10 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 md:hidden text-2xl transition"><i class="fa-solid fa-bars"></i></button>
                <div class="text-sm font-bold text-gray-400 tracking-widest hidden md:block">DASHBOARD</div>
            </div>
            <div class="flex items-center gap-4 md:gap-6">
                <button onclick="toggleTheme()" class="text-gray-400 hover:text-yellow-500 dark:hover:text-blue-400 transition text-lg" title="Toggle Theme">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline"></i>
                </button>
                
                <div class="hidden sm:flex items-center gap-2 bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full border dark:border-gray-700">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div>
                    <span class="text-xs font-semibold text-gray-600 dark:text-gray-300">SYSTEM ACTIVE</span>
                </div>
                <div class="flex items-center gap-3 sm:border-l dark:border-gray-700 sm:pl-6">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-bold text-gray-800 dark:text-gray-200">Administrator</div>
                        <div class="text-[10px] font-bold text-green-500">ADMINISTRATOR</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">A</div>
                    <button onclick="logout()" class="text-gray-400 hover:text-red-500 ml-1 md:ml-2 transition" title="Keluar"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#f8f9fc] dark:bg-[#0f172a] transition-colors duration-300">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-white italic mb-6">System Overview</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white dark:bg-[#1e293b] p-6 rounded-xl border dark:border-gray-700/50 shadow-sm flex items-center gap-4 transition-colors duration-300">
                    <div class="bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 p-4 rounded-lg"><i class="fa-solid fa-server text-2xl"></i></div>
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 font-bold">Hardware Devices</p>
                        <h2 id="statDevices" class="text-3xl font-bold text-gray-800 dark:text-white">0</h2>
                    </div>
                </div>

                <div class="bg-white dark:bg-[#1e293b] p-6 rounded-xl border dark:border-gray-700/50 shadow-sm flex items-center gap-4 transition-colors duration-300">
                    <div class="bg-purple-100 dark:bg-purple-900/50 text-purple-600 dark:text-purple-400 p-4 rounded-lg"><i class="fa-solid fa-cloud text-2xl"></i></div>
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 font-bold">Virtual Machines</p>
                        <h2 id="statVMs" class="text-3xl font-bold text-gray-800 dark:text-white">0</h2>
                    </div>
                </div>

                <div class="bg-white dark:bg-[#1e293b] p-6 rounded-xl border dark:border-gray-700/50 shadow-sm flex items-center gap-4 transition-colors duration-300">
                    <div class="bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 p-4 rounded-lg"><i class="fa-solid fa-network-wired text-2xl"></i></div>
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 font-bold">IP Addresses</p>
                        <h2 id="statIPs" class="text-3xl font-bold text-gray-800 dark:text-white">0</h2>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white dark:bg-[#1e293b] p-6 rounded-xl border dark:border-gray-700/50 shadow-sm w-full flex flex-col transition-colors duration-300">
                    <h3 class="text-lg font-bold text-gray-700 dark:text-gray-200 mb-4 border-b dark:border-gray-700 pb-2">Distribusi Perangkat (Hardware & VM)</h3>
                    <div class="relative w-full h-64 flex-1 flex items-center justify-center">
                        <canvas id="overviewChart"></canvas>
                    </div>
                </div>

                <div class="bg-white dark:bg-[#1e293b] p-6 rounded-xl border dark:border-gray-700/50 shadow-sm w-full overflow-x-auto transition-colors duration-300">
                    <h3 class="text-lg font-bold text-gray-700 dark:text-gray-200 mb-4 border-b dark:border-gray-700 pb-2">Recently Added Inventory</h3>
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-gray-50/50 dark:bg-gray-800/50 border-b dark:border-gray-700">
                                <th class="py-3 px-4 text-xs font-bold text-gray-400 dark:text-gray-400 uppercase">Item Name</th>
                                <th class="py-3 px-4 text-xs font-bold text-gray-400 dark:text-gray-400 uppercase">Type</th>
                                <th class="py-3 px-4 text-xs font-bold text-gray-400 dark:text-gray-400 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentTableBody" class="divide-y dark:divide-gray-700">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
