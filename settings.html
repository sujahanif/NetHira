<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netbox Lite - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-[#0f172a] h-screen flex overflow-hidden relative transition-colors duration-300">

    <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity"></div>

    <aside id="sidebar" class="w-64 bg-[#131b2f] dark:bg-[#0b1121] text-white flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 z-30">
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-700/50">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-1.5 rounded-md"><i class="fa-solid fa-server text-sm"></i></div>
                <span class="font-bold text-lg tracking-wider italic text-blue-100">NETBOX LITE</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 flex flex-col">
            <a href="dashboard.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Dashboard</a>
            <a href="index.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Devices</a>
            <a href="virtual-machines.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Virtual Machines</a>
            <a href="ip-addresses.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">IP Addresses</a>
            <div class="mt-auto pt-8">
                <a href="settings.html" class="block px-4 py-3 text-sm text-white bg-blue-600 rounded-lg font-medium shadow-md flex items-center gap-2"><i class="fa-solid fa-gear"></i> Settings</a>
            </div>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden w-full">
        <header class="h-16 bg-white dark:bg-[#1e293b] border-b dark:border-gray-700/50 flex items-center justify-between px-4 md:px-8 z-10 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 md:hidden text-2xl transition"><i class="fa-solid fa-bars"></i></button>
                <div class="text-sm font-bold text-gray-400 tracking-widest hidden md:block">SETTINGS</div>
            </div>
            <div class="flex items-center gap-4 md:gap-6">
                <button onclick="toggleTheme()" class="text-gray-400 hover:text-yellow-500 dark:hover:text-blue-400 transition text-lg" title="Toggle Theme">
                    <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i>
                </button>
                <div class="hidden sm:flex items-center gap-2 bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full border dark:border-gray-700">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div><span class="text-xs font-semibold text-gray-600 dark:text-gray-300">SYSTEM ACTIVE</span>
                </div>
                <div class="flex items-center gap-3 sm:border-l dark:border-gray-700 sm:pl-6">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-bold text-gray-800 dark:text-gray-200" id="headerName">Administrator</div>
                        <div class="text-[10px] font-bold text-green-500">ADMINISTRATOR</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm" id="headerInitial">A</div>
                    <button onclick="logout()" class="text-gray-400 hover:text-red-500 ml-1 md:ml-2 transition" title="Keluar"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#f8f9fc] dark:bg-[#0f172a] transition-colors duration-300">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-white italic flex items-center gap-2 mb-6">
                <i class="fa-solid fa-user-shield text-blue-500"></i> Account Settings
            </h1>

            <div class="bg-white dark:bg-[#1e293b] rounded-xl border dark:border-gray-700/50 shadow-sm max-w-2xl overflow-hidden transition-colors duration-300">
                <div class="p-6 border-b dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50">
                    <h2 class="font-bold text-gray-800 dark:text-white text-lg">Ubah Kredensial Login</h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Ganti username dan password default untuk mengamankan aplikasimu.</p>
                </div>
                
                <div class="p-6 space-y-5">
                    <div><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Nama Tampilan (Full Name)</label><input type="text" id="setFullname" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-gray-50 dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                    <hr class="dark:border-gray-700">
                    <div><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Username Baru</label><input type="text" id="setUsername" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                    <div><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Password Baru</label><input type="password" id="setPassword" placeholder="Minimal 4 karakter" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                    <div><label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Konfirmasi Password Baru</label><input type="password" id="setConfirmPassword" class="w-full border dark:border-gray-600 rounded-lg px-4 py-2 text-sm text-gray-800 dark:text-white bg-white dark:bg-gray-700 outline-none focus:border-blue-500"></div>
                </div>
                
                <div class="p-6 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
                    <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-semibold shadow-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-save"></i> Simpan Perubahan
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="settings.js"></script>
</body>
</html>
