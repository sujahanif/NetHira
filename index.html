<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netbox Lite - Devices</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden relative">

    <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity"></div>

    <aside id="sidebar" class="w-64 bg-[#131b2f] text-white flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 z-30">
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-700/50">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-1.5 rounded-md">
                    <i class="fa-solid fa-server text-sm"></i>
                </div>
                <span class="font-bold text-lg tracking-wider italic text-blue-100">NETBOX LITE</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="dashboard.html" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Dashboard</a>
            <a href="index.html" class="block px-4 py-3 text-sm text-white bg-blue-600 rounded-lg font-medium shadow-md">Devices</a>
            <a href="#" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Virtual Machines</a>
            <a href="#" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">IP Addresses</a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden w-full">
        <header class="h-16 bg-white border-b flex items-center justify-between px-4 md:px-8 z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-gray-500 hover:text-blue-600 md:hidden text-2xl transition">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="text-sm font-bold text-gray-400 tracking-widest hidden md:block">DEVICES</div>
            </div>
            
            <div class="flex items-center gap-4 md:gap-6">
                <div class="hidden sm:flex items-center gap-2 bg-gray-100 px-3 py-1 rounded-full border">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div>
                    <span class="text-xs font-semibold text-gray-600">SYSTEM ACTIVE</span>
                </div>
                <div class="flex items-center gap-3 sm:border-l sm:pl-6">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-bold text-gray-800">Syahira Adenia</div>
                        <div class="text-[10px] font-bold text-green-500">ADMINISTRATOR</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">S</div>
                    <button onclick="logout()" class="text-gray-400 hover:text-red-500 ml-1 md:ml-2 transition" title="Keluar">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#f8f9fc]">
            <div class="flex flex-col 2xl:flex-row 2xl:items-center justify-between gap-4 mb-6">
                <h1 class="text-xl md:text-2xl font-bold text-gray-800 italic flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-chevron-right text-lg text-gray-500"></i> Hardware Inventory
                </h1>
                
                <div class="flex flex-col lg:flex-row items-start lg:items-center gap-4 w-full 2xl:w-auto justify-end">
                    
                    <div class="flex items-center gap-2 w-full lg:w-auto">
                        <select id="filterStatus" class="border rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm text-gray-600 bg-white outline-none focus:border-blue-500">
                            <option value="All">All Status</option>
                            <option value="ONLINE">ONLINE</option>
                            <option value="OFFLINE">OFFLINE</option>
                        </select>
                        
                        <select id="filterRole" class="border rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm text-gray-600 bg-white outline-none focus:border-blue-500">
                            <option value="All">All Roles</option>
                            <option value="SERVER">SERVER</option>
                            <option value="ROUTER">ROUTER</option>
                            <option value="SWITCH">SWITCH</option>
                        </select>
                        
                        <input type="text" id="searchInput" placeholder="Search..." class="border rounded-lg px-3 py-2 text-xs md:text-sm outline-none focus:border-blue-500 w-full lg:w-40 flex-grow">
                    </div>
                    
                    <div class="flex items-center gap-2 w-full lg:w-auto overflow-x-auto pb-1 lg:pb-0">
                        <button onclick="exportData()" class="whitespace-nowrap flex-1 sm:flex-none bg-[#f43f5e] hover:bg-rose-600 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition">
                            <i class="fa-solid fa-file-pdf"></i> PDF
                        </button>
                        
                        <button onclick="backupData()" class="whitespace-nowrap flex-1 sm:flex-none bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition">
                            <i class="fa-solid fa-download"></i> BACKUP
                        </button>
                        
                        <input type="file" id="restoreFile" accept=".json" class="hidden" onchange="processRestore(event)">
                        <button onclick="document.getElementById('restoreFile').click()" class="whitespace-nowrap flex-1 sm:flex-none bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition">
                            <i class="fa-solid fa-upload"></i> RESTORE
                        </button>

                        <button onclick="openModal()" class="whitespace-nowrap flex-1 sm:flex-none bg-[#2a56f6] hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold flex justify-center items-center gap-2 shadow-sm transition">
                            <i class="fa-solid fa-plus"></i> ADD
                        </button>
                    </div>
                    
                </div>
            </div>

            <div class="bg-white rounded-xl border shadow-sm overflow-x-auto w-full">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-50/50 border-b">
                            <th onclick="sortTable('name')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">
                                Device Name <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i>
                            </th>
                            <th onclick="sortTable('role')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">
                                Role <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i>
                            </th>
                            <th onclick="sortTable('ip')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">
                                IP Address <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i>
                            </th>
                            <th onclick="sortTable('status')" class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-blue-500 transition group w-1/5">
                                Status <i class="fa-solid fa-sort ml-1 opacity-50 group-hover:opacity-100"></i>
                            </th>
                            <th class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider w-1/5">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y">
                        </tbody>
                </table>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center mt-6 gap-4">
                <div class="text-sm text-gray-500" id="paginationInfo">
                    Menampilkan <span class="font-bold text-gray-800">0</span> sampai <span class="font-bold text-gray-800">0</span> dari <span class="font-bold text-gray-800">0</span> perangkat
                </div>
                <div class="flex items-center gap-1" id="paginationButtons">
                    </div>
            </div>
        </main>
    </div>

    <div id="addDeviceModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center transition-opacity p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800"><i class="fa-solid fa-server mr-2 text-blue-500"></i> Add New Asset</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 md:p-6 space-y-4">
                <div><label class="block text-xs font-bold text-gray-500 mb-1">Device Name</label><input type="text" id="modalDeviceName" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></div>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 mb-1">Role</label><select id="modalRole" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500"><option value="SERVER">SERVER</option><option value="ROUTER">ROUTER</option><option value="SWITCH">SWITCH</option></select></div>
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 mb-1">Status</label><select id="modalStatus" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500"><option value="ONLINE">ONLINE</option><option value="OFFLINE">OFFLINE</option></select></div>
                </div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">IP Address</label><input type="text" id="modalIpAddress" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></div>
            </div>
            <div class="px-6 py-4 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-200 transition">Cancel</button>
                <button onclick="saveDevice()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition">Save Device</button>
            </div>
        </div>
    </div>

    <div id="editDeviceModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center transition-opacity p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800"><i class="fa-solid fa-pen-to-square mr-2 text-blue-500"></i> Edit Asset</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 md:p-6 space-y-4">
                <input type="hidden" id="editModalId">
                <div><label class="block text-xs font-bold text-gray-500 mb-1">Device Name</label><input type="text" id="editModalDeviceName" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></div>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 mb-1">Role</label><select id="editModalRole" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500"><option value="SERVER">SERVER</option><option value="ROUTER">ROUTER</option><option value="SWITCH">SWITCH</option></select></div>
                    <div class="w-full md:w-1/2"><label class="block text-xs font-bold text-gray-500 mb-1">Status</label><select id="editModalStatus" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500"><option value="ONLINE">ONLINE</option><option value="OFFLINE">OFFLINE</option></select></div>
                </div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">IP Address</label><input type="text" id="editModalIpAddress" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></div>
            </div>
            <div class="px-6 py-4 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-200 transition">Cancel</button>
                <button onclick="updateDevice()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition">Update Data</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
