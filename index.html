<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetHira - Devices</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <aside class="w-64 bg-[#131b2f] text-white flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-gray-700/50">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-1.5 rounded-md">
                    <i class="fa-solid fa-server text-sm"></i>
                </div>
                <span class="font-bold text-lg tracking-wider italic text-blue-100">NETHIRA</span>
            </div>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Dashboard</a>
            <a href="#" class="block px-4 py-3 text-sm text-white bg-blue-600 rounded-lg font-medium shadow-md">Devices</a>
            <a href="#" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">Virtual Machines</a>
            <a href="#" class="block px-4 py-3 text-sm text-gray-400 hover:text-white rounded-lg transition">IP Addresses</a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b flex items-center justify-between px-8 z-10">
            <div class="text-sm font-bold text-gray-400 tracking-widest">DEVICES</div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 bg-gray-100 px-3 py-1 rounded-full border">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div>
                    <span class="text-xs font-semibold text-gray-600">SYSTEM ACTIVE</span>
                </div>
                <div class="flex items-center gap-3 border-l pl-6">
                    <div class="text-right">
                        <div class="text-sm font-bold text-gray-800">Syahira Adenia</div>
                        <div class="text-[10px] font-bold text-green-500">ADMINISTRATOR</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">S</div>
                    <button class="text-gray-400 hover:text-gray-600 ml-2">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-[#f8f9fc]">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-gray-800 italic flex items-center gap-2">
                    <i class="fa-solid fa-chevron-right text-lg text-gray-500"></i> Hardware Inventory
                </h1>
                
                <div class="flex items-center gap-3">
                    <select id="filterStatus" class="border rounded-lg px-4 py-2 text-sm text-gray-600 bg-white outline-none focus:border-blue-500">
                        <option value="All">All Status</option>
                        <option value="ONLINE">ONLINE</option>
                        <option value="OFFLINE">OFFLINE</option>
                    </select>
                    
                    <select id="filterRole" class="border rounded-lg px-4 py-2 text-sm text-gray-600 bg-white outline-none focus:border-blue-500">
                        <option value="All">All Roles</option>
                        <option value="SERVER">SERVER</option>
                        <option value="ROUTER">ROUTER</option>
                        <option value="SWITCH">SWITCH</option>
                    </select>
                    
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search IP or Name..." class="border rounded-lg pl-4 pr-8 py-2 text-sm outline-none focus:border-blue-500 w-48">
                    </div>
                    
                    <button onclick="exportData()" class="bg-[#f43f5e] hover:bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 shadow-sm transition">
                        <i class="fa-solid fa-file-pdf"></i> EXPORT PDF
                    </button>
                    
                    <button onclick="openModal()" class="bg-[#2a56f6] hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 shadow-sm transition">
                        <i class="fa-solid fa-plus"></i> ADD ASSET
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50/50 border-b">
                            <th class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider w-1/5">Device Name</th>
                            <th class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider w-1/5">Role</th>
                            <th class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider w-1/5">IP Address</th>
                            <th class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider w-1/5">Status</th>
                            <th class="py-4 px-6 text-xs font-bold text-gray-400 uppercase tracking-wider w-1/5">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="addDeviceModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center transition-opacity">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800"><i class="fa-solid fa-server mr-2 text-blue-500"></i> Add New Asset</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Device Name</label>
                    <input type="text" id="modalDeviceName" placeholder="e.g. mikrotik-office" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
                
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Role</label>
                        <select id="modalRole" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500">
                            <option value="SERVER">SERVER</option>
                            <option value="ROUTER">ROUTER</option>
                            <option value="SWITCH">SWITCH</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Status</label>
                        <select id="modalStatus" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500">
                            <option value="ONLINE">ONLINE</option>
                            <option value="OFFLINE">OFFLINE</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">IP Address</label>
                    <input type="text" id="modalIpAddress" placeholder="e.g. 192.168.1.100" class="w-full border rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="px-6 py-4 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-200 transition">Cancel</button>
                <button onclick="saveDevice()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition">Save Device</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
